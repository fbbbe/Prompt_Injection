experiment:
  name: "baseline_gemma4_e4b_q4km"
  date: "2026-09-28"
  description: "Baseline experiment for prompt injection robustness evaluation on Gemma 4 E4B Q4_K_M."

model:
  name: "gemma4:e4b"
  architecture: "gemma4"
  parameters: "8.0B" # 약 80억 개의 파라미터
  quantization: "Q4_K_M" # 약 4비트 수준의 K-quant 양자화 방식
  context_length: 131072 # 모델이 지원하는 최대 컨텍스트 길이(토큰 수)
  embedding_length: 2560 # 모델 내부 표현 벡터의 차원
  observed_date: "2026-09-15"

generation:
  temperature: 0 # 출력의 무작위성을 최소화하여 재현성을 높임
  seed: 42 # 난수 생성 조건을 고정하기 위한 값
  top_k: 64 # 다음 토큰 생성 시 확률이 높은 상위 64개 후보를 고려
  top_p: 0.95 # 후보를 확률순으로 더해 누적 확률이 0.95가 될 때까지 고려
  num_ctx: 4096 # 실험에서 실제로 사용할 컨텍스트 윈도우 크기(토큰 수)
  num_predict: 256 # 모델이 생성할 수 있는 최대 출력 토큰 수

benchmark:
  name: "tensor_trust_hijacking"
  version: "v1"
  path: "data/tensor_trust_hijacking_v1.jsonl"

  url: "https://raw.githubusercontent.com/HumanCompatibleAI/tensor-trust-data/main/benchmarks/hijacking-robustness/v1/hijacking_robustness_dataset.jsonl"

  # 처음 테스트할 때 10 정도로 설정
  # 전체 실험은 null
  max_cases: 100

run:
  repeat: 1

  output_path: "results/raw/baseline_gemma4_e4b_q4km.jsonl"

  readable_output_path: "results/readable/baseline_gemma4_e4b_q4km.md"
